spring:
  application:
    name: mvp-backend
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.timeout: 10000

  datasource:
    url: jdbc:h2:file:./data/mvpdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss

logging:
  file:
    name: ./app.log

flink:
  home: ${FLINK_HOME:D:\\code\\flink-1.18.1}
  cluster:
    host: ${FLINK_CLUSTER_HOST:localhost}
    port: ${FLINK_CLUSTER_PORT:8081}
  sql-gateway:
    host: ${FLINK_SQL_GATEWAY_HOST:}
    port: ${FLINK_SQL_GATEWAY_PORT:8083}
  parallelism:
    default: 1

plugin:
  dir: ${PLUGIN_DIR:./plugins}

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  security:
    bootstrap-users-enabled: ${BOOTSTRAP_USERS_ENABLED:false}
    admin-password: ${ADMIN_PASSWORD:}
    operator-password: ${OPERATOR_PASSWORD:}
    viewer-password: ${VIEWER_PASSWORD:}
  hadoop-home: ${HADOOP_HOME:D:\\code\\hadoop}
  ai:
    provider: ${AI_PROVIDER:openai}
    api-key: ${OPENAI_API_KEY:${DEEPSEEK_API_KEY:}}
    base-url: ${OPENAI_BASE_URL:${DEEPSEEK_BASE_URL:https://api.deepseek.com}}
    model: ${OPENAI_MODEL:${DEEPSEEK_MODEL:deepseek-v4-flash}}
    allowed-models: ${AI_ALLOWED_MODELS:deepseek-v4-flash,deepseek-v4-flash-vision-exp}
    timeout-ms: ${AI_TIMEOUT_MS:60000}
  alert:
    email:
      host: ${SMTP_HOST:}
      username: ${SMTP_USER:}
      to: ${SMTP_TO:}
    # 告警保留策略：默认保留 30 天且最多 5000 条（0 = 不限制该项）
    retention-days: ${APP_ALERT_RETENTION_DAYS:30}
    retention-max-records: ${APP_ALERT_RETENTION_MAX:5000}

  preview:
    allowed-roots: ${APP_PREVIEW_ALLOWED_ROOTS:../data,../test-resources,../output}
    max-file-bytes: ${APP_PREVIEW_MAX_FILE_BYTES:67108864}
  storage:
    output-root: ${OUTPUT_ROOT:../output}

  mysql:
    # mysql_input/mysql_output 控件默认用户名与密码（预填 + 预览用），通过环境变量注入，不入库
    default-username: ${MYSQL_USERNAME:root}
    default-password: ${MYSQL_PASSWORD:}

  monitor:
    # 告警/健康扫描与 Flink 状态轮询间隔（毫秒），越小告警越及时但也越耗 Flink HTTP
    health-scan-ms: ${APP_MONITOR_HEALTH_SCAN_MS:10000}
    status-poll-ms: ${APP_MONITOR_STATUS_POLL_MS:5000}
    # 心跳感知：探测间隔（毫秒）与连续失败阈值
    heartbeat-scan-ms: ${APP_MONITOR_HEARTBEAT_SCAN_MS:10000}
    heartbeat:
      cluster-misses: ${APP_MONITOR_HEARTBEAT_CLUSTER_MISSES:3}
      job-misses: ${APP_MONITOR_HEARTBEAT_JOB_MISSES:3}

spring.servlet.multipart.max-file-size: 50MB
spring.servlet.multipart.max-request-size: 50MB
