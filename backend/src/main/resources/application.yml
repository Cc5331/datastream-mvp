spring:
  application:
    name: mvp-backend
  datasource:
    url: jdbc:h2:file:./data/mvpdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss

logging:
  file:
    name: ./app.log

flink:
  home: ${FLINK_HOME:D:\\code\\flink-1.18.1}
  cluster:
    host: ${FLINK_CLUSTER_HOST:localhost}
    port: ${FLINK_CLUSTER_PORT:8081}
  sql-gateway:
    host: ${FLINK_SQL_GATEWAY_HOST:}
    port: ${FLINK_SQL_GATEWAY_PORT:8083}
  parallelism:
    default: 1

plugin:
  dir: ${PLUGIN_DIR:./plugins}

server:
  port: 8080

spring.servlet.multipart.max-file-size: 50MB
spring.servlet.multipart.max-request-size: 50MB
