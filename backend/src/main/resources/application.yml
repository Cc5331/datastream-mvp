spring:
  application:
    name: mvp-backend
  # 定时任务线程池：默认 1 线程会让 6 个 @Scheduled 任务（趋势采集 2s / 状态轮询 5s /
  # 健康与心跳扫描 10s / 调度 30s）相互排队，作业多时告警与调度严重延迟
  task:
    scheduling:
      pool:
        size: ${APP_SCHEDULING_POOL_SIZE:4}
      thread-name-prefix: mvp-sched-
    execution:
      pool:
        core-size: ${APP_ASYNC_CORE_SIZE:4}
        max-size: ${APP_ASYNC_MAX_SIZE:8}
        queue-capacity: ${APP_ASYNC_QUEUE_CAPACITY:500}
      thread-name-prefix: mvp-async-
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.timeout: 10000

  datasource:
    url: jdbc:h2:file:./data/mvpdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      # 默认关闭 H2 Web 控制台（它可直连元数据库读写用户表/AI 配置）；
      # 仅本机排障时用 H2_CONSOLE_ENABLED=true 临时开启，且开启后仍需 ADMIN 角色登录（见 SecurityConfig）
      enabled: ${H2_CONSOLE_ENABLED:false}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss

logging:
  file:
    name: ./app.log

flink:
  home: ${FLINK_HOME:D:\\code\\flink-1.18.1}
  cluster:
    host: ${FLINK_CLUSTER_HOST:localhost}
    port: ${FLINK_CLUSTER_PORT:8081}
  sql-gateway:
    host: ${FLINK_SQL_GATEWAY_HOST:}
    port: ${FLINK_SQL_GATEWAY_PORT:8083}
  parallelism:
    default: 1

plugin:
  dir: ${PLUGIN_DIR:./plugins}

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  security:
    bootstrap-users-enabled: ${BOOTSTRAP_USERS_ENABLED:false}
    admin-password: ${ADMIN_PASSWORD:}
    operator-password: ${OPERATOR_PASSWORD:}
    viewer-password: ${VIEWER_PASSWORD:}
    # 允许跨域访问 /api 的来源白名单（逗号分隔）；写 * 时不携带凭据，仅用于临时排障
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  hadoop-home: ${HADOOP_HOME:D:\\code\\hadoop}
  data-source:
    key-file: ${DATA_SOURCE_KEY_FILE:./data/.data_source_key}
    allowed-hosts: ${DATA_SOURCE_ALLOWED_HOSTS:${APP_PREVIEW_ALLOWED_JDBC_HOSTS:localhost,127.0.0.1,mysql,postgres,oracle,kafka,redis,namenode}}
  profile:
    avatar-dir: ${AVATAR_DIR:./data/avatars}
  user-presence:
    timeout-ms: ${USER_PRESENCE_TIMEOUT_MS:90000}
    minimum-write-interval-ms: ${USER_PRESENCE_MINIMUM_WRITE_INTERVAL_MS:20000}
  ai:
    # 默认 DeepSeek；切回 OpenAI 时设 AI_PROVIDER=openai 并提供 OPENAI_API_KEY
    provider: ${AI_PROVIDER:deepseek}
    api-key: ${DEEPSEEK_API_KEY:${OPENAI_API_KEY:}}
    base-url: ${DEEPSEEK_BASE_URL:${OPENAI_BASE_URL:https://api.deepseek.com}}
    model: ${DEEPSEEK_MODEL:${OPENAI_MODEL:deepseek-v4-flash}}
    allowed-models: ${AI_ALLOWED_MODELS:deepseek-v4-flash,deepseek-v4-flash-vision-exp}
    timeout-ms: ${AI_TIMEOUT_MS:60000}
    # 推理模型会先输出 reasoning_content（实测单次诊断约占 1500 tokens），
    # 预算过小会导致 content 为空并报「LLM 返回为空」
    max-tokens: ${AI_MAX_TOKENS:16000}
  alert:
    email:
      host: ${SMTP_HOST:}
      username: ${SMTP_USER:}
      to: ${SMTP_TO:}
    # 告警保留策略：默认保留 30 天且最多 5000 条（0 = 不限制该项）
    retention-days: ${APP_ALERT_RETENTION_DAYS:30}
    retention-max-records: ${APP_ALERT_RETENTION_MAX:5000}

  preview:
    allowed-roots: ${APP_PREVIEW_ALLOWED_ROOTS:../data,../test-resources,../output}
    max-file-bytes: ${APP_PREVIEW_MAX_FILE_BYTES:67108864}
    allowed-jdbc-hosts: ${APP_PREVIEW_ALLOWED_JDBC_HOSTS:localhost,127.0.0.1,mysql,postgres,oracle,kafka,redis,namenode}
    allowed-hdfs-authorities: ${APP_PREVIEW_ALLOWED_HDFS_AUTHORITIES:localhost:9000,namenode:9000}
  paths:
    # 控件默认路径根目录：本机为相对 backend 工作目录的相对路径，容器由 compose 注入
    # APP_DATA_ROOT=/data、APP_TEST_RESOURCES_ROOT=/test-resources
    data-root: ${APP_DATA_ROOT:../data}
    test-resources-root: ${APP_TEST_RESOURCES_ROOT:../test-resources}
  storage:
    output-root: ${OUTPUT_ROOT:../output}

  mysql:
    # mysql_input/mysql_output 控件默认用户名与密码（预填 + 预览用），通过环境变量注入，不入库
    default-username: ${MYSQL_USERNAME:root}
    default-password: ${MYSQL_PASSWORD:}
    # 控件默认 JDBC URL：本机 localhost:3306，容器内由 compose 注入 mysql:3306/datastream
    default-url: ${MYSQL_URL:jdbc:mysql://localhost:3306/flink_demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
  postgres:
    # PostgreSQL 输入/输出默认凭据，仅从环境变量注入
    default-username: ${POSTGRES_USERNAME:postgres}
    default-password: ${POSTGRES_PASSWORD:}
    default-url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/dataflow}
  oracle:
    # Oracle 输入/输出默认凭据，仅从环境变量注入
    default-username: ${ORACLE_USERNAME:system}
    default-password: ${ORACLE_PASSWORD:}
    default-url: ${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}

  kafka:
    # Kafka 可视化（/api/kafka/*）连接地址；本机运行用 localhost:29092，容器内用 kafka:9092
    bootstrap-servers: ${APP_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

  monitor:
    # 告警/健康扫描与 Flink 状态轮询间隔（毫秒），越小告警越及时但也越耗 Flink HTTP
    health-scan-ms: ${APP_MONITOR_HEALTH_SCAN_MS:10000}
    status-poll-ms: ${APP_MONITOR_STATUS_POLL_MS:5000}
    # 心跳感知：探测间隔（毫秒）与连续失败阈值
    heartbeat-scan-ms: ${APP_MONITOR_HEARTBEAT_SCAN_MS:10000}
    heartbeat:
      cluster-misses: ${APP_MONITOR_HEARTBEAT_CLUSTER_MISSES:3}
      job-misses: ${APP_MONITOR_HEARTBEAT_JOB_MISSES:3}

spring.servlet.multipart.max-file-size: 50MB
spring.servlet.multipart.max-request-size: 50MB
