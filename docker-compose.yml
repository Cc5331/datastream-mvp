name: datastream-mvp

services:
  # ---------- 存储 / 消息 ----------
  mysql:
    image: mysql:8.0
    container_name: mvp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: datastream
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"            # 本机 3306 可能被本地 MySQL 占用，故映射 3307
    volumes:
      - mysql_data:/var/lib/mysql
      - ./data/mysql_setup.sql:/docker-entrypoint-initdb.d/01-setup.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: mvp-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dataflow}
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/postgres_setup.sql:/docker-entrypoint-initdb.d/01-setup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    container_name: mvp-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis-init:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    depends_on:
      redis:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        redis-cli -h redis -a "$${REDIS_PASSWORD}" SET user:1 VIP
        redis-cli -h redis -a "$${REDIS_PASSWORD}" SET user:2 NORMAL
        redis-cli -h redis -a "$${REDIS_PASSWORD}" SET sale:1 华东重点订单
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
    restart: "no"

  namenode:
    image: ${HADOOP_IMAGE:-apache/hadoop:3.3.6}
    container_name: mvp-namenode
    hostname: namenode
    user: root
    command: ["bash", "-c", "/opt/hadoop/bin/hdfs namenode -format -nonInteractive -force && exec /opt/hadoop/bin/hdfs namenode"]
    environment:
      HADOOP_HOME: /opt/hadoop
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
    ports:
      - "${HDFS_RPC_PORT:-9000}:9000"
      - "${HDFS_UI_PORT:-9870}:9870"
    volumes:
      - ./docker/hadoop-conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./docker/hadoop-conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - namenode_data:/tmp/hadoop-root/dfs/name
    healthcheck:
      test: ["CMD-SHELL", "/opt/hadoop/bin/hdfs dfsadmin -report >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 24

  datanode:
    image: ${HADOOP_IMAGE:-apache/hadoop:3.3.6}
    container_name: mvp-datanode
    hostname: datanode
    user: root
    command: ["bash", "-c", "exec /opt/hadoop/bin/hdfs datanode"]
    depends_on:
      namenode:
        condition: service_healthy
    environment:
      HADOOP_HOME: /opt/hadoop
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
    ports:
      - "${HDFS_DATANODE_UI_PORT:-9864}:9864"
    volumes:
      - ./docker/hadoop-conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./docker/hadoop-conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - datanode_data:/tmp/hadoop-root/dfs/data

  oracle:
    profiles: ["oracle"]
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: mvp-oracle
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:?请在 .env 中设置 ORACLE_SYS_PASSWORD}
      APP_USER: ${ORACLE_USERNAME:-dataflow}
      APP_USER_PASSWORD: ${ORACLE_PASSWORD:?请在 .env 中设置 ORACLE_PASSWORD}
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./data/oracle_setup.sql:/container-entrypoint-initdb.d/01-setup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 30

  kafka:
    image: apache/kafka:3.8.0
    container_name: mvp-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "29092:29092"          # 宿主机访问 localhost:29092；容器内互访 kafka:9092
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12

  # ---------- Flink ----------
  jobmanager:
    build: ./docker/flink
    image: datastream-flink:1.18.1
    container_name: mvp-jobmanager
    command: jobmanager
    ports:
      - "${FLINK_UI_PORT:-18081}:8081" # Flink Web UI / REST（宿主机端口可覆盖）
    environment:
      HADOOP_CONF_DIR: /opt/hadoop-conf
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 1024m
        parallelism.default: 1
        rest.address: 0.0.0.0
        rest.port: 8081
        classloader.resolve-order: parent-first
        state.checkpoints.dir: file:///flink-checkpoints
    volumes:
      - flink_checkpoints:/flink-checkpoints
      - ./output:/output       # 作业输出目录（与宿主机共享）
      - ./data:/data           # 业务数据目录
      - ./test-resources:/test-resources  # 测试数据集（表头剥离需写入 .nohdr，故可写）
      - ./docker/hadoop-conf:/opt/hadoop-conf:ro

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8081'"]
      interval: 10s
      timeout: 5s
      retries: 15

  taskmanager:
    build: ./docker/flink
    image: datastream-flink:1.18.1
    container_name: mvp-taskmanager
    command: taskmanager
    depends_on:
      jobmanager:
        condition: service_healthy
    environment:
      HADOOP_CONF_DIR: /opt/hadoop-conf
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.host: taskmanager
        taskmanager.numberOfTaskSlots: 2
        taskmanager.memory.process.size: 2048m
        taskmanager.memory.managed.size: 256m
        parallelism.default: 1
        classloader.resolve-order: parent-first
        state.checkpoints.dir: file:///flink-checkpoints
    volumes:
      - flink_checkpoints:/flink-checkpoints
      - ./output:/output
      - ./data:/data
      - ./test-resources:/test-resources  # 表头剥离需写入 .nohdr 临时文件，故可写
      - ./docker/hadoop-conf:/opt/hadoop-conf:ro

  sql-gateway:
    build: ./docker/flink
    image: datastream-flink:1.18.1
    container_name: mvp-sql-gateway
    command: ["/opt/flink/bin/sql-gateway.sh", "start-foreground"]
    depends_on:
      jobmanager:
        condition: service_healthy
    ports:
      - "${SQL_GATEWAY_PORT:-18083}:8083" # Flink SQL Gateway REST（宿主机端口可覆盖）
    environment:
      HADOOP_CONF_DIR: /opt/hadoop-conf
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        rest.address: jobmanager
        rest.port: 8081
        sql-gateway.endpoint.rest.address: 0.0.0.0
        sql-gateway.endpoint.rest.port: 8083
        parallelism.default: 1
        classloader.resolve-order: parent-first
        state.checkpoints.dir: file:///flink-checkpoints
    volumes:
      - flink_checkpoints:/flink-checkpoints
      - ./output:/output
      - ./data:/data
      - ./test-resources:/test-resources  # 表头剥离需写入 .nohdr 临时文件，故可写
      - ./docker/hadoop-conf:/opt/hadoop-conf:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8083'"]
      interval: 10s
      timeout: 5s
      retries: 15

  # ---------- 应用 ----------
  backend:
    build: ./backend
    image: datastream-backend:1.0.0
    container_name: mvp-backend
    depends_on:
      jobmanager:
        condition: service_healthy
      sql-gateway:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-18080}:8080" # 后端 API（宿主机端口可覆盖）
    environment:
      FLINK_CLUSTER_HOST: jobmanager
      FLINK_CLUSTER_PORT: "8081"
      FLINK_SQL_GATEWAY_HOST: sql-gateway
      FLINK_SQL_GATEWAY_PORT: "8083"
      FLINK_HOME: /opt/flink
      PLUGIN_DIR: /app/plugins
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置至少 32 字节的 JWT_SECRET}
      BOOTSTRAP_USERS_ENABLED: ${BOOTSTRAP_USERS_ENABLED:-false}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-}
      VIEWER_PASSWORD: ${VIEWER_PASSWORD:-}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      ORACLE_USERNAME: ${ORACLE_USERNAME:-dataflow}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?请在 .env 中设置 ORACLE_PASSWORD}
      APP_PREVIEW_ALLOWED_ROOTS: /data,/output
      APP_PREVIEW_ALLOWED_JDBC_HOSTS: postgres,oracle,mysql
      APP_PREVIEW_ALLOWED_HDFS_AUTHORITIES: namenode:9000
      HADOOP_CONF_DIR: /opt/hadoop-conf
      OUTPUT_ROOT: /output
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      AI_ALLOWED_MODELS: ${AI_ALLOWED_MODELS:-gpt-4.1-mini,gpt-4.1,gpt-4o-mini}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    volumes:
      - ./backend/data:/app/data          # H2 数据库持久化
      - ./backend/plugins:/app/plugins    # 控件插件热加载
      - ./output:/output
      - ./data:/data
      - ./test-resources:/test-resources  # 表头剥离需写入 .nohdr 临时文件，故可写
      - ./docker/hadoop-conf:/opt/hadoop-conf:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 15

  frontend:
    build: ./frontend
    image: datastream-frontend:1.0.0
    container_name: mvp-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"            # 前端页面
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "8080"
      PORT: "3000"

volumes:
  mysql_data:
  postgres_data:
  redis_data:
  namenode_data:
  datanode_data:
  oracle_data:
  kafka_data:
  flink_checkpoints:
